- table: appointments
  class: appointmentsClass
  fields:
    - guid: char(36) not null
    - cdate: timestamp default current_timestamp
    - cuser: char(32) not null
    - pguid: char(36) not null
    - adate: timestamp default current_timestamp
    - aplace: text
    - anote: text

