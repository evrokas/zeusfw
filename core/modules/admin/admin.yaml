routes:
  adminmodule:
    title: 'Administration'
    name: admin_handler
    url: /admin
    module: admin
    # method: get
  admin_list:
    title: "Admin: list"
    url: "/admin/{entity}"
    handler: admin_list
    method: get
  admin_new:
    title: "Admin: new"
    url: "/admin/{entity}/new"
    handler: admin_new
    method: get
  admin_new_post:
    title: "Admin: new"
    url: "/admin/{entity}/new"
    handler: admin_new_post
    method: post
  admin_edit:
    title: "Admin: edit"
    url: "/admin/{entity}/{id}/edit"
    handler: admin_edit
    method: get
  admin_edit_post:
    title: "Admin: edit"
    url: "/admin/{entity}/{id}/edit"
    handler: admin_edit_post
    method: post
  admin_delete:
    title: "Admin: delete"
    url: "/admin/{entity}/{id}/delete"
    handler: admin_delete
    method: post

libraries:
  admin-library:
    css:
      - admin:
        src: '@core/css/admin.css'
