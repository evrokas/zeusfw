table: 
  name: users
  class: usersClass
  fields:
    - name: "name"
      type: varchar(64)
      db_required: true

    - name: "email"
      type: varchar(128)
      db_required: true

    - name: "uname"
      type: "@cuser"

    - name: "upass"
      type: varchar(65)
      db_required: true

    - name: "cdate"
      type: "@cdate"

    - name: "active"
      type: boolean
      db_default: false

    - name: "expired"
      type: boolean
      db_default: true

    - name: "wrongpasscount"
      type: smallint
      db_default: 0

    - name: "roles"
      type: "@guid"
  