table: 
  name: user_tokens
  class: userTokensClass
  fields:
    - name: "cdate"
      type: "@cdate"

    - name: "selector"
      type: varchar(255)
      db_required: true

    - name: "validator"
      type: varchar(255)
      db_required: true

    - name: uname
      type: "@cuser"

    - name: "remoteip"
      type: varchar(25)
      db_required: true

    - name: "useragent"
      type: varchar(255)
      db_required: true

    - name: "expiry"
      type: datetime
      db_required: true
